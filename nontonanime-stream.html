<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Memuat… — Movixa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0b0d14', paper: '#eae6dd',
          amber: { 300: '#ffcf6b', 400: '#f5a524' },
          crimson: { 400: '#e23744', 300: '#ff5c6c' }
        },
        fontFamily: { display: ['Anton', 'sans-serif'], sans: ['Manrope', 'sans-serif'] }
      }
    }
  };
</script>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="bg-ink text-paper antialiased" data-page="nontonanime">
<div class="grain"></div>
<div id="headerMount"></div>

<div id="loadingState" class="min-h-screen flex items-center justify-center pt-16">
  <div class="text-center">
    <div class="w-12 h-12 mx-auto mb-4 rounded-full border-2 border-white/10 border-t-amber-400 animate-spin"></div>
    <p class="text-paper/50 text-sm">Memuat episode…</p>
  </div>
</div>

<div id="errorState" class="hidden min-h-screen flex items-center justify-center pt-16">
  <div class="text-center max-w-md px-6">
    <p class="font-display text-3xl mb-3 text-crimson-300">Episode tidak ditemukan</p>
    <p class="text-paper/50 text-sm mb-6">Episode ini mungkin sudah tidak tersedia atau server sedang bermasalah.</p>
    <a href="/nontonanime.html" class="inline-flex marquee-gradient text-ink font-extrabold px-6 py-3 rounded-full text-sm">Kembali ke NontonAnime</a>
  </div>
</div>

<div id="streamContent" class="hidden pt-20 pb-20">
  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10">

    <div class="mb-5">
      <a id="animeLinkBtn" href="#" class="text-xs text-paper/50 hover:text-amber-300 transition-colors">&larr; <span id="animeLinkText">Kembali ke anime</span></a>
      <h1 id="titleEl" class="font-display text-2xl sm:text-4xl leading-tight mt-2"></h1>
    </div>

    <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-ink-2 marquee-ring mb-4">
      <iframe id="videoFrame" class="w-full h-full" src="" allowfullscreen frameborder="0" referrerpolicy="no-referrer"></iframe>
      <div id="playerLoading" class="absolute inset-0 flex items-center justify-center bg-ink/70 hidden">
        <div class="w-10 h-10 rounded-full border-2 border-white/10 border-t-amber-400 animate-spin"></div>
      </div>
    </div>

    <div class="flex items-center justify-between gap-3 mb-8">
      <a id="prevEpBtn" href="#" class="hidden inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 font-bold px-4 py-2.5 rounded-full text-sm transition-colors">&larr; Sebelumnya</a>
      <a id="allEpsBtn" href="#" class="hidden inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 font-bold px-4 py-2.5 rounded-full text-sm transition-colors mx-auto">Semua Episode</a>
      <a id="nextEpBtn" href="#" class="hidden inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 font-bold px-4 py-2.5 rounded-full text-sm transition-colors">Selanjutnya &rarr;</a>
    </div>

    <section id="serverSection" class="hidden mb-10">
      <div class="eyebrow mb-2">Pilih Server</div>
      <h2 class="font-display text-xl sm:text-2xl mb-4">Server Streaming</h2>
      <div id="serverList" class="flex flex-wrap gap-2.5"></div>
    </section>

    <section id="downloadSection" class="hidden">
      <div class="eyebrow mb-2">Unduh</div>
      <h2 class="font-display text-xl sm:text-2xl mb-4">Link Download</h2>
      <div id="downloadList" class="space-y-4"></div>
    </section>

  </main>
</div>

<div id="footerMount"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/chrome.js"></script>
<script src="/assets/js/nontonanime-stream.js"></script>
</body>
</html>
