<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Memuat… — Movixa</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0b0d14', paper: '#eae6dd',
          amber: { 300: '#ffcf6b', 400: '#f5a524' },
          crimson: { 400: '#e23744', 300: '#ff5c6c' }
        },
        fontFamily: { display: ['Anton', 'sans-serif'], sans: ['Manrope', 'sans-serif'] }
      }
    }
  };
</script>
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="bg-ink text-paper antialiased" data-page="livechart">
<div class="grain"></div>
<div id="headerMount"></div>

<div id="loadingState" class="min-h-screen flex items-center justify-center pt-16">
  <div class="text-center">
    <div class="w-12 h-12 mx-auto mb-4 rounded-full border-2 border-white/10 border-t-amber-400 animate-spin"></div>
    <p class="text-paper/50 text-sm">Memuat data anime…</p>
  </div>
</div>

<div id="errorState" class="hidden min-h-screen flex items-center justify-center pt-16">
  <div class="text-center max-w-md px-6">
    <p class="font-display text-3xl mb-3 text-crimson-300">Anime tidak ditemukan</p>
    <p class="text-paper/50 text-sm mb-6">Judul ini mungkin sudah tidak tersedia atau server LiveChart sedang bermasalah.</p>
    <a href="/livechart.html" class="inline-flex marquee-gradient text-ink font-extrabold px-6 py-3 rounded-full text-sm">Kembali ke LiveChart</a>
  </div>
</div>

<div id="detailContent" class="hidden">

  <section class="relative pt-16">
    <div id="backdropImg" class="absolute inset-0 -z-20 bg-cover bg-center blur-sm opacity-40" style="background-position: center 20%;"></div>
    <div class="absolute inset-0 -z-10 bg-gradient-to-t from-ink via-ink/90 to-ink/60"></div>
    <div class="absolute inset-0 -z-10 bg-gradient-to-r from-ink/95 via-ink/40 to-transparent"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 pt-10 pb-10 sm:pt-16 sm:pb-16">
      <div class="flex flex-col md:flex-row gap-8 items-start">
        <img id="posterImg" src="" alt="" class="hidden md:block w-48 lg:w-56 rounded-xl marquee-ring shrink-0" />

        <div class="flex-1 min-w-0">
          <div id="genreTags" class="flex flex-wrap items-center gap-2.5 mb-4"></div>
          <h1 id="titleEl" class="font-display text-3xl sm:text-5xl leading-[0.98] mb-2"></h1>
          <p id="altTitleEl" class="hidden text-paper/40 text-sm mb-4"></p>
          <p id="synopsisEl" class="text-paper/70 text-sm sm:text-base leading-relaxed max-w-2xl mb-6"></p>
          <div id="metaRow" class="flex flex-wrap gap-x-8 gap-y-2 text-sm text-paper/60 mb-5"></div>

          <div id="scheduleBox" class="hidden bg-white/5 border border-white/10 rounded-xl px-5 py-4 mb-5 max-w-sm text-center">
            <p id="scheduleEpText" class="text-xs text-paper/50 uppercase tracking-wider mb-1"></p>
            <p id="scheduleTimeText" class="font-display text-lg text-paper"></p>
          </div>

          <div id="countdownBanner" class="hidden mb-5">
            <div class="flex items-center gap-2 mb-2">
              <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <span id="countdownText" class="text-xs font-bold text-amber-200"></span>
            </div>
            <div id="countdownGrid" class="grid grid-cols-4 gap-2 max-w-sm">
              <div class="bg-amber-400/10 border border-amber-400/30 rounded-xl px-2 py-2.5 text-center">
                <div data-cd="days" class="font-display text-xl text-amber-200 leading-none">0</div>
                <div class="text-[10px] uppercase tracking-wider text-paper/50 mt-1">days</div>
              </div>
              <div class="bg-amber-400/10 border border-amber-400/30 rounded-xl px-2 py-2.5 text-center">
                <div data-cd="hours" class="font-display text-xl text-amber-200 leading-none">0</div>
                <div class="text-[10px] uppercase tracking-wider text-paper/50 mt-1">hours</div>
              </div>
              <div class="bg-amber-400/10 border border-amber-400/30 rounded-xl px-2 py-2.5 text-center">
                <div data-cd="minutes" class="font-display text-xl text-amber-200 leading-none">0</div>
                <div class="text-[10px] uppercase tracking-wider text-paper/50 mt-1">minutes</div>
              </div>
              <div class="bg-amber-400/10 border border-amber-400/30 rounded-xl px-2 py-2.5 text-center">
                <div data-cd="seconds" class="font-display text-xl text-amber-200 leading-none">0</div>
                <div class="text-[10px] uppercase tracking-wider text-paper/50 mt-1">seconds</div>
              </div>
            </div>
          </div>

          <div id="hashtagRow" class="hidden flex flex-wrap gap-3 mb-2"></div>
        </div>
      </div>
    </div>
  </section>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-10 py-14 space-y-16">

    <section id="characterSection" class="hidden">
      <div class="eyebrow mb-2">Cast</div>
      <h2 class="font-display text-2xl sm:text-3xl mb-6">Karakter</h2>
      <div id="characterList" class="rail flex gap-4 overflow-x-auto no-scrollbar pb-2 cursor-grab active:cursor-grabbing"></div>
    </section>

    <section id="streamSection">
      <div class="eyebrow mb-2">Tonton Resmi</div>
      <h2 class="font-display text-2xl sm:text-3xl mb-6">Link Streaming Resmi</h2>
      <div id="streamList" class="grid sm:grid-cols-2 gap-3"></div>
    </section>

    <section id="videoSection">
      <div class="eyebrow mb-2">Trailer</div>
      <h2 class="font-display text-2xl sm:text-3xl mb-6">Promotional Videos</h2>
      <div id="videoList" class="rail flex gap-4 overflow-x-auto no-scrollbar pb-2 cursor-grab active:cursor-grabbing"></div>
    </section>

  </main>
</div>

<div id="footerMount"></div>

<script src="/assets/js/common.js"></script>
<script src="/assets/js/chrome.js"></script>
<script src="/assets/js/livechart-detail.js"></script>
</body>
</html>
